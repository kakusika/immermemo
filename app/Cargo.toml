[package]
name = "immermemo"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is what the Android activity loads; `staticlib` is what iOS Xcode
# targets link; `lib` is what the desktop binary and tests link.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "immermemo"
path = "src/main.rs"

[dependencies]
immermemo-core = { workspace = true }
immermemo-platform = { workspace = true }
immermemo-shell = { workspace = true }
immermemo-shell-state = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
directories = { workspace = true }

# Desktop (non-mobile): mimalloc for high-throughput UI / background sync.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mimalloc = { workspace = true }

# Linux Desktop: winit on Wayland + FemtoVG.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = [
  "backend-winit-wayland",
  "renderer-femtovg",
] }

# iOS: winit + FemtoVG.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["i-slint-backend-android-activity/renderer-femtovg"]

[target.'cfg(target_os = "android")'.dependencies]
# For the Android Keystore token store: plain JNI calls into java.security /
# javax.crypto, no Gradle-managed dependency needed.
jni = "0.21"
slint = { version = "1.18", default-features = false, features = [
  "backend-android-activity-06",
  "compat-1-2",
  # `platform/android/fonts.rs` repairs the fallbacks through fontique.
  "unstable-fontique-011",
] }
i-slint-backend-android-activity = { version = "=1.18.1", default-features = false }

[dev-dependencies]
origiri-icons = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
slint = { workspace = true, features = ["software-renderer-systemfonts"] }
