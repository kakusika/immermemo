[package]
name = "immermemo"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is what the Android activity loads; `staticlib` is what iOS Xcode
# targets link; `lib` is what the desktop binary and tests link.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "immermemo"
path = "src/main.rs"

[dependencies]
immermemo-editor = { workspace = true }
immermemo-identity = { workspace = true }
immermemo-index = { workspace = true }
immermemo-merge = { workspace = true }
immermemo-sync = { workspace = true }
immermemo-tomet-render = { workspace = true }
immermemo-vault = { workspace = true }

#= Origiri
origiri-icons = { workspace = true }
origiri-mobile = { workspace = true }
origiri-richtext = { workspace = true }
origiri-richtext-flow = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
directories = { workspace = true }
git2 = { workspace = true }
sys-locale = { workspace = true }

# Linux Desktop: winit on Wayland + Skia.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = [
  "backend-winit-wayland",
  "renderer-skia",
] }

# iOS: winit + Skia (Metal backend on iOS).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-skia"] }

[target.'cfg(target_os = "android")'.dependencies]
# For the Android Keystore token store: plain JNI calls into java.security /
# javax.crypto, no Gradle-managed dependency needed.
jni = "0.21"
# `renderer-femtovg` is requested and is what actually draws -- but it does
# NOT mean Skia is absent from the Android build, despite that being the
# intent. `i-slint-backend-android-activity` 1.18.1's own (published, not
# this repo's) Cargo.toml has an unconditional
# `[target.'cfg(target_os = "android")'.dependencies.i-slint-renderer-skia]`
# with no feature gate -- so Skia's GPU (Ganesh/OpenGL) backend and SkSL
# shader compiler get linked into every Android build regardless, confirmed
# by `strings` on the built .so (`GrProgramDesc.cpp`, `GrGLSLVarying.cpp`,
# SkSL symbols all present) and accounting for essentially all of its
# ~24 MB. This is NOT github.com/slint-ui/slint#13011 (that one's about
# skia-safe's own default features -- pdf/jpeg/embedded-ICU -- being left
# enabled; those specifically are *not* present here, since
# i-slint-renderer-skia's Android dependency already sets
# `default-features = false`, confirmed by their total absence from the
# built .so's strings). No cargo-level feature flag avoids the Skia core
# itself; as of 2026-10-04 no upstream issue covers that specific gap.
slint = { version = "1.18", default-features = false, features = [
  "backend-android-activity-06",
  "compat-1-2",
  "renderer-femtovg",
] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
#= Tomet
# Only used to build `.tmt` fixtures in `#[cfg(test)]` -- production code
# goes through `immermemo-editor` instead (see its own `tomet` dependency).
tomet = { workspace = true, features = ["parser", "printer"] }

#= Crates.io
tempfile = "3"

# Only for `examples/snap.rs` (Linux development only -- it renders the window
# headlessly at a chosen size; the software renderer needs this to find
# system (Japanese) fonts). Target-gated: an *unconditional*
# `[dev-dependencies]` entry here would still pull in `backend-winit-wayland`
# (or the full Skia renderer) into mobile (`--lib`/`staticlib`) builds too,
# even though neither Android nor iOS ever uses it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
slint = { workspace = true, features = ["software-renderer-systemfonts"] }
