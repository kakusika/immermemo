[package]
name = "immermemo"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is what the Android activity loads; `staticlib` is what iOS Xcode
# targets link; `lib` is what the desktop binary and tests link.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "immermemo"
path = "src/main.rs"

[dependencies]
immermemo-core = { workspace = true }
immermemo-credentials = { workspace = true }
immermemo-provider = { workspace = true }
immermemo-render-tomet = { workspace = true }
tomet = { workspace = true }

#= Origiri
origiri-icons = { workspace = true }
origiri-mobile = { workspace = true }
origiri-richtext = { workspace = true }
origiri-richtext-flow = { workspace = true }
origiri-selection = { workspace = true }
origiri-theme = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
directories = { workspace = true }
image = { workspace = true }
qrcode = { workspace = true }
sys-locale = { workspace = true }
ureq = { workspace = true }
webbrowser = { workspace = true }

# Linux Desktop: winit on Wayland + FemtoVG.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = [
  "backend-winit-wayland",
  "renderer-femtovg",
] }

# iOS: winit + FemtoVG.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["i-slint-backend-android-activity/renderer-femtovg"]

[target.'cfg(target_os = "android")'.dependencies]
# For the Android Keystore token store: plain JNI calls into java.security /
# javax.crypto, no Gradle-managed dependency needed.
jni = "0.21"
slint = { version = "1.18", default-features = false, features = [
  "backend-android-activity-06",
  "compat-1-2",
] }
i-slint-backend-android-activity = { version = "=1.18.1", default-features = false }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
#= Tomet
# Only used to build `.tmt` fixtures in `#[cfg(test)]`.
tomet = { workspace = true, features = ["merge", "parser", "printer"] }

#= Crates.io
tempfile = "3"

# Only for `examples/snap.rs` (Linux development only -- it renders the window
# headlessly at a chosen size; the software renderer needs this to find
# system (Japanese) fonts). Target-gated: an *unconditional*
# `[dev-dependencies]` entry here would still pull in `backend-winit-wayland`
# (or the full FemtoVG renderer) into mobile (`--lib`/`staticlib`) builds too,
# even though neither Android nor iOS ever uses it.
[target.'cfg(target_os = "linux")'.dev-dependencies]
slint = { workspace = true, features = ["software-renderer-systemfonts"] }
