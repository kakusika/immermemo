[package]
name = "immermemo-core"
version.workspace = true
edition.workspace = true

[dependencies]
immermemo-identity = { workspace = true }
immermemo-index = { workspace = true }
immermemo-sync = { workspace = true }
immermemo-vault = { workspace = true }
immermemo-credentials = { workspace = true }
immermemo-provider = { workspace = true }
#= Tomet
tomet = { workspace = true, features = [
  "edit",
  "merge",
  "parser",
  "printer",
  "stats",
] }

#= Crates.io
anyhow = { workspace = true }
directories = { workspace = true }
git2 = { workspace = true }

[dev-dependencies]
immermemo-sync = { workspace = true, features = ["test-support"] }
immermemo-render-tomet = { workspace = true }
tempfile = "3"
