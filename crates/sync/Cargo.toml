[package]
name = "immermemo-sync"
version.workspace = true
edition.workspace = true

[dependencies]
immermemo-identity = { workspace = true }
immermemo-vault = { workspace = true }

#= Tomet
tomet = { workspace = true, features = ["parser", "printer", "merge"] }

#= Crates.io
anyhow = { workspace = true }
git2 = { workspace = true }
openssl = { workspace = true }
# Only for the `test-support` fixtures.
tempfile = { version = "3", optional = true }

[features]
# Fixtures (`testing`) for tests of this crate and of crates built on it.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
