[package]
name = "immermemo"
version.workspace = true
edition.workspace = true

[lib]
# `cdylib` is what the Android activity loads; `lib` is what the desktop
# binary links.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "immermemo"
path = "src/main.rs"

[dependencies]
immermemo-editor = { workspace = true }
immermemo-index = { workspace = true }
immermemo-merge = { workspace = true }
immermemo-sync = { workspace = true }
immermemo-tomet-render = { workspace = true }
immermemo-vault = { workspace = true }

#= Origami
origami-icons = { workspace = true }
origami-mobile = { workspace = true }
origami-richtext = { workspace = true }
origami-richtext-flow = { workspace = true }

#= Crates.io
anyhow = { workspace = true }
git2 = { workspace = true }
sys-locale = { workspace = true }

# Desktop: winit + Skia (the workspace default). Android: its own backend, and
# no Skia -- its prebuilt binaries are not fetched for that target.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# For the Android Keystore token store: plain JNI calls into java.security /
# javax.crypto, no Gradle-managed dependency needed.
jni = "0.21"
slint = { version = "1.18", default-features = false, features = [
  "backend-android-activity-06",
  "compat-1-2",
  "renderer-femtovg",
] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
#= Tomet
# Only used to build `.tmt` fixtures in `#[cfg(test)]` -- production code
# goes through `immermemo-editor` instead (see its own `tomet-parser`/
# `tomet-printer` dependency).
tomet-parser = { workspace = true }
tomet-printer = { workspace = true }

#= Crates.io
# Only for `examples/snap.rs`, which renders the window headlessly at a chosen
# size: the software renderer needs this to find system (Japanese) fonts.
slint = { workspace = true, features = ["software-renderer-systemfonts"] }
tempfile = "3"

[package.metadata.android]
package = "dev.immermemo.app"
# aarch64 is what a real phone needs; x86_64 lets the same APK also install
# on an emulator running at native speed under KVM (see nix/dev.nix).
# Target-specific APKs can be built via `just apk-arm` or `just apk-x86`.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "immermemo"
# TODO: Re-enable `extract_native_libs = false` once cargo-apk supports storing
# uncompressed (Stored) and 4KB/16KB page-aligned libraries. Currently, cargo-apk
# writes android:extractNativeLibs="false" to the manifest but still Deflates
# the .so, causing Android 11+ to reject installation with INSTALL_FAILED_INVALID_APK.

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
