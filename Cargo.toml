[workspace]
resolver = "3"

members = [
  "immermemo",
  "crates/editor",
  "crates/identity",
  "crates/index",
  "crates/merge",
  "crates/sync",
  "crates/tomet-render",
  "crates/vault",
]

default-members = ["immermemo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
immermemo-editor = { path = "crates/editor" }
immermemo-identity = { path = "crates/identity" }
immermemo-index = { path = "crates/index" }
immermemo-merge = { path = "crates/merge" }
immermemo-sync = { path = "crates/sync" }
immermemo-tomet-render = { path = "crates/tomet-render" }
immermemo-vault = { path = "crates/vault" }

#= Origami
origami-icons = { git = "https://github.com/kakusika/origami-frameworks.git" }
origami-mobile = { git = "https://github.com/kakusika/origami-frameworks.git" }
origami-richtext = { git = "https://github.com/kakusika/origami-frameworks.git" }
origami-richtext-flow = { git = "https://github.com/kakusika/origami-frameworks.git" }

#= Tomet
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-edit = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-stats = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git" }

#= Crates.io
anyhow = "1.0"
directories = "6"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
loro = "1.16"
# Same OpenSSL git2's vendored-openssl already builds and links; used to
# verify TLS certificate chains ourselves where libgit2's own file-based
# verification can't work at all (see crates/sync's `tls` module doc).
openssl = "0.10"
rusqlite = { version = "0.33", features = ["bundled"] }
# Target-specific backends and renderers are selected in `immermemo/Cargo.toml`.
slint = { version = "1.18", default-features = false, features = [
  "compat-1-2",
] }
slint-build = "1.18"
sys-locale = "0.3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
