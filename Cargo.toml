[workspace]
resolver = "3"

members = [
  "app",
  "crates/core",
  "crates/credentials",
  "crates/identity",
  "crates/index",
  "crates/provider",
  "crates/sync",
  "crates/render-tomet",
  "crates/vault",
]

default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
immermemo-core = { path = "crates/core" }
immermemo-credentials = { path = "crates/credentials" }
immermemo-identity = { path = "crates/identity" }
immermemo-index = { path = "crates/index" }
immermemo-provider = { path = "crates/provider" }
immermemo-sync = { path = "crates/sync" }
immermemo-render-tomet = { path = "crates/render-tomet" }
immermemo-vault = { path = "crates/vault" }

#= Origiri
origiri-icons = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-mobile = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-richtext = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-richtext-flow = { git = "https://github.com/kakusika/origiri-frameworks.git" }
origiri-selection = { git = "https://github.com/kakusika/origiri-frameworks.git" }

#= Tomet
tomet = { git = "https://github.com/tomet-lang/tomet.git" }

#= Crates.io
anyhow = "1.0"
base64 = "0.23"
directories = "6"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
# Same OpenSSL git2's vendored-openssl already builds and links; used to
# verify TLS certificate chains ourselves where libgit2's own file-based
# verification can't work at all (see crates/sync's `tls` module doc).
openssl = "0.10"
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Target-specific backends and renderers are selected in `app/Cargo.toml`.
slint = { version = "1.18", default-features = false, features = [
  "compat-1-2",
] }
slint-build = "1.18"
ssh-key = { version = "0.6", features = ["ed25519", "crypto", "std"] }
sys-locale = "0.3"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
webbrowser = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
i-slint-backend-android-activity = { path = "patches/i-slint-backend-android-activity" }
