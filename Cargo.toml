[workspace]
resolver = "3"

members = [
  "apps/slint",
  "core/merge",
  "core/sync",
]

default-members = ["apps/slint"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
immermemo-merge = { path = "core/merge" }
immermemo-sync = { path = "core/sync" }

#[ Tomet -- the language this reads and writes ]
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }
tomet-load = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git", version = "0.1.0" }

#[ Crates.io ]
anyhow = "1.0"
loro = "1.16"
# Same feature set mumeum runs on: Skia is the only renderer compiled in by default,
# `renderer-software` stays as a manual fallback (`SLINT_BACKEND=winit-software`).
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-skia", "renderer-software", "accessibility", "compat-1-2"] }
slint-build = "1.18"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
# Same OpenSSL git2's vendored-openssl already builds and links; used to
# verify TLS certificate chains ourselves where libgit2's own file-based
# verification can't work at all (see core/sync's `tls` module doc).
openssl = "0.10"
